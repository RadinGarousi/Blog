{% extends "base/main_base.html" %}
{% load static %}

{% block title %}GoldBlog{% endblock %}

{% block extra_css %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'blog/css/detail.css' %}">
{% endblock %}

{% block content %}
    {{ block.super }}
    <div class="post-page">
        <img src="{{ blog.cover.url }}" class="post-page__img" alt="blog picture">
        <div class="post-body">
            <h1>{{ blog.title }}</h1>
            <div class="post-content">
                <p>{{ blog.body|linebreaks }}</p>
            </div>
            <div class="post__info">
                <a href="{{ blog.author.get_absolute_url }}" class="post__author">✍ {{ blog.author.username }}</a>
                <div class="post__like-dislike">
                    <img src="{% static 'blog/icon/like_dislike.svg' %}" alt="Like Icon" class="post__like">
                    <img src="{% static 'blog/icon/like_dislike.svg' %}" alt="" class="post__like">
                </div>
                </div>
            <div class="comments">
                <h2>کامنت ها</h2>
                <div class="comment-box">
                    <input type="text" placeholder="نظر خود را وارد کنید">
                    <a href="#" class="comment__submit">ارسال</a>
                    <div class="commentList"></div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
